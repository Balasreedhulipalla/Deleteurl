<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Account</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #2d5be3;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Delete Your Nano Meta Tool Account</h1>
    <p>We're sorry to see you go. Please submit this form to request permanent deletion of your account.</p>

    <form>
      <input type="text" placeholder="Enter your full name" required>
      <input type="email" placeholder="Enter your registered email" required>
      <textarea placeholder="Reason for leaving (optional)"></textarea>

      <button type="submit">Delete My Account</button>
    </form>
  </div>

</body>
</html>
